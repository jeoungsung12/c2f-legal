<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Legal — Onsaemigol</title>
<style>
  :root { --bg:#ffffff; --ink:#1d1d1f; --sub:#6e6e73; --link:#0066cc; --line:#d2d2d7; --th:#f5f5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --ink:#f5f5f7; --sub:#a1a1a6; --link:#2997ff; --line:#424245; --th:#1d1d1f; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 72px; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .lang { margin:0 0 32px; font-size:14px; color:var(--sub); }
  .lang strong { color:var(--ink); font-weight:600; }
  h1 { font-size:28px; line-height:1.3; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em; }
  h2 { font-size:19px; line-height:1.4; font-weight:600; margin:40px 0 12px; padding-top:24px; border-top:1px solid var(--line); }
  .meta { margin:0 0 32px; font-size:14px; color:var(--sub); }
  p { margin:0 0 14px; }
  ul, ol { margin:0 0 14px; padding-left:22px; }
  li { margin:6px 0; }
  dl.info { margin:0 0 16px; display:grid; grid-template-columns:max-content 1fr; gap:4px 20px; font-size:15px; }
  dl.info dt { color:var(--sub); }
  dl.info dd { margin:0; }
  .table-wrap { overflow-x:auto; margin:12px 0 16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; line-height:1.55; }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:var(--th); font-weight:600; }
  code { font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .note { font-size:14px; color:var(--sub); }
  footer { margin-top:56px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--sub); }
  footer p { margin:0 0 4px; }
  .links { list-style:none; padding:0; margin:0 0 24px; }
  .links li { margin:0; padding:12px 0; border-bottom:1px solid var(--line); font-size:17px; }
  .links li:first-child { border-top:1px solid var(--line); }
  .section-label { font-size:13px; color:var(--sub); margin:32px 0 8px; text-transform:uppercase; letter-spacing:0.04em; }
</style>
